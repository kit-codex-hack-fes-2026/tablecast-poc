services:
  tablecast-lgtm:
    extends:
      file: ../compose.yaml
      service: tablecast-lgtm
    # OTLPはCompose内から使い、ホストへはGrafanaとTempoだけを公開する。
    ports: !override
      - "127.0.0.1:${TABLECAST_GRAFANA_PORT}:3000"
      - "127.0.0.1:${TABLECAST_TEMPO_PORT}:3200"
  tablecast:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    working_dir: ${TABLECAST_WORKSPACE_FOLDER:?Run tablecast-init.sh first}
    command: [sh, -c, 'git config --global --add safe.directory "$$PWD" && sleep infinity']
    depends_on:
      - tablecast-lgtm
    environment:
      BUN_INSTALL_CACHE_DIR: ${TABLECAST_WORKSPACE_FOLDER}/node_modules/.cache/tablecast-bun
      TABLECAST_CONTAINER: "1"
      TABLECAST_RTC_TCP_PORT: ${TABLECAST_RTC_TCP_PORT}
      TABLECAST_RTC_UDP_PORT: ${TABLECAST_RTC_UDP_PORT}
      TABLECAST_WORKTREE_NAME: ${TABLECAST_WORKTREE_NAME:-main}
      TABLECAST_REPO_NAME: ${TABLECAST_REPO_NAME:-tablecast-poc}
      TABLECAST_CONTAINER_ORIGIN: ${TABLECAST_CONTAINER_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${TABLECAST_WEB_PORT}:3000"
      - "127.0.0.1:${TABLECAST_MAILPIT_PORT}:8025"
      - "127.0.0.1:${TABLECAST_RTC_TCP_PORT}:${TABLECAST_RTC_TCP_PORT}"
      - "127.0.0.1:${TABLECAST_RTC_UDP_PORT}:${TABLECAST_RTC_UDP_PORT}/udp"
      - "127.0.0.1:${TABLECAST_STORYBOOK_PORT}:6006"
    labels:
      dev.orbstack.domains: ${TABLECAST_WORKTREE_NAME:-main}.${TABLECAST_REPO_NAME:-tablecast-poc}.orb.local
      dev.orbstack.http-port: "3000"
    volumes:
      - type: bind
        source: ${TABLECAST_WORKSPACE_FOLDER}
        target: ${TABLECAST_WORKSPACE_FOLDER}
      - type: bind
        source: ${TABLECAST_GIT_COMMON_DIR}
        target: ${TABLECAST_GIT_COMMON_DIR}
      - tablecast-node:${TABLECAST_WORKSPACE_FOLDER}/node_modules
      - tablecast-web-node:${TABLECAST_WORKSPACE_FOLDER}/apps/web/node_modules
      - tablecast-api-node:${TABLECAST_WORKSPACE_FOLDER}/apps/api/node_modules
      - tablecast-emulate-node:${TABLECAST_WORKSPACE_FOLDER}/apps/emulate/node_modules
      - tablecast-livekit-node:${TABLECAST_WORKSPACE_FOLDER}/livekit/node_modules
      - tablecast-python:${TABLECAST_WORKSPACE_FOLDER}/livekit/.venv
      - tablecast-state:${TABLECAST_WORKSPACE_FOLDER}/.local
      - tablecast-web-output:${TABLECAST_WORKSPACE_FOLDER}/apps/web/dist
      - tablecast-web-vite:${TABLECAST_WORKSPACE_FOLDER}/apps/web/.wrangler
volumes:
  tablecast-lgtm:
  tablecast-node:
  tablecast-web-node:
  tablecast-api-node:
  tablecast-emulate-node:
  tablecast-livekit-node:
  tablecast-python:
  tablecast-state:
  tablecast-web-output:
  tablecast-web-vite:
