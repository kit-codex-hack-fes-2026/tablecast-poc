name: tablecast-${TABLECAST_ID:?Run bun run dev:prepare first}
services:
  tablecast-lgtm:
    extends:
      file: grafana/compose.yaml
      service: tablecast-lgtm
    ports:
      - "127.0.0.1:${TABLECAST_OTLP_PORT}:4318"
  tablecast-mailpit:
    image: axllent/mailpit:v1.29.2
    ports:
      - "127.0.0.1:${TABLECAST_MAILPIT_PORT}:8025"
      - "127.0.0.1:${TABLECAST_SMTP_PORT}:1025"
  tablecast-livekit:
    image: livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    command: ["--config", "/etc/tablecast-livekit.yaml"]
    ports:
      - "127.0.0.1:${TABLECAST_SIGNALING_PORT}:${TABLECAST_SIGNALING_PORT}"
      - "127.0.0.1:${TABLECAST_RTC_TCP_PORT}:${TABLECAST_RTC_TCP_PORT}"
      - "127.0.0.1:${TABLECAST_RTC_UDP_PORT}:${TABLECAST_RTC_UDP_PORT}/udp"
    volumes:
      - ${TABLECAST_ROOT}/.local/livekit.yaml:/etc/tablecast-livekit.yaml:ro
volumes:
  tablecast-lgtm:
    name: tablecast-${TABLECAST_ID}-lgtm
