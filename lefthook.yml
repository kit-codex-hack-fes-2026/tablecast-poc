lefthook: bunx --no-install lefthook

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,jsonc,md,yml,yaml,css}"
      exclude:
        - "apps/presentation/assets/openscreen/**/*.json"
        - ".agents/skills/hyperframes-core/**"
        - ".agents/skills/hyperframes-animation/**"
        - ".agents/skills/hyperframes-creative/**"
      run: bunx --no-install oxfmt --check {staged_files}
    - name: analysis
      group:
        piped: true
        jobs:
          - name: codegen
            run: bun run codegen
          - name: checks
            group:
              parallel: true
              jobs:
                - name: lint
                  glob: "*.{ts,tsx,js}"
                  exclude:
                    - ".agents/skills/hyperframes-core/**"
                    - ".agents/skills/hyperframes-animation/**"
                    - ".agents/skills/hyperframes-creative/**"
                  run: bunx --no-install oxlint --type-aware --deny-warnings {staged_files}
                - name: fallow
                  run: bun run fallow:audit --base HEAD --quiet
commit-msg:
  commands:
    commitlint:
      run: bunx --no-install commitlint --edit "{1}"
