name: "不具合報告"
description: "期待動作、実際の動作、再現手順を書く。"
labels: [fix]
body:
  - type: markdown
    attributes:
      value: "画像・動画を添える場合は関連説明中に置き、短いキャプションを添える。ログはコードブロックで示す。秘密情報を除き、必要なら圧縮する。"
  - type: textarea
    id: behavior
    attributes:
      label: "期待動作と実際の動作"
      description: "正しい動作と観測した問題を書く。"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順"
      description: "操作、環境、影響範囲を分かる範囲で書く。画像・動画を添える場合は関連説明中に置き、短いキャプションを添える。ログはコードブロックで示す。秘密情報を除き、必要なら圧縮する。"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "修正の確認方法"
      description: "期待動作に戻ったと判断する条件を書く。UI・Webアプリの見た目や操作を変える場合だけ、変更後の画像か動画をPRの関連説明中へ添える。CLI・API・設定・文書の結果はテキストやコードブロックで示す。"
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: "意思決定と最小実装の方針"
      description: "採用方針と理由、比較した有力な代替案を書く。minimum-implに照らし、再利用する既存実装・標準機能と、独自実装が必要な理由を説明する。未決定なら判断に必要な証拠を示す。文書・調査・epicはその成果の粒度で書き、適用外の項目には理由を添える。"
    validations:
      required: true
  - type: textarea
    id: test_strategy
    attributes:
      label: "テスト戦略との整合"
      description: "fullstack-web-testingに照らし、受入条件・リスクを担保するレイヤー（具体的なランナー）と選択理由を書く。下位層で十分な規則と統合・E2Eで確認する境界を区別する。起票時は計画と未確定事項を示し、実行結果はPRへ書く。自動テストが適用外なら理由と代わりの確認を書く。"
    validations:
      required: true
