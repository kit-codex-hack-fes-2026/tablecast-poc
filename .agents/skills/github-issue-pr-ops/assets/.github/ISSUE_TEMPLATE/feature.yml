name: "機能追加"
description: "実現したい成果と確認方法を書く。"
labels: [feat]
body:
  - type: markdown
    attributes:
      value: "画像・動画を添える場合は関連説明中に置き、短いキャプションを添える。ログはコードブロックで示す。秘密情報を除き、必要なら圧縮する。"
  - type: textarea
    id: purpose
    attributes:
      label: "目的と背景"
      description: "何を、なぜ実現したいかを書く。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "受け入れ条件"
      description: "完了と判断できる振る舞いを書く。"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "確認方法"
      description: "テストや操作手順を書く。UI・Webアプリの見た目や操作を変える場合だけ、変更後の画像か動画をPRの関連説明中へ添える。CLI・API・設定・文書の結果はテキストやコードブロックで示す。"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "補足"
      description: "必要なら対象範囲、扱わない隣接機能、参照資料を書く。"
    validations:
      required: false
  - type: textarea
    id: decisions
    attributes:
      label: "意思決定と最小実装の方針"
      description: "採用方針と理由、比較した有力な代替案を書く。minimum-implに照らし、再利用する既存実装・標準機能と、独自実装が必要な理由を説明する。未決定なら判断に必要な証拠を示す。文書・調査・epicはその成果の粒度で書き、適用外の項目には理由を添える。"
    validations:
      required: true
  - type: textarea
    id: test_strategy
    attributes:
      label: "テスト戦略との整合"
      description: "fullstack-web-testingに照らし、受入条件・リスクを担保するレイヤー（具体的なランナー）と選択理由を書く。下位層で十分な規則と統合・E2Eで確認する境界を区別する。起票時は計画と未確定事項を示し、実行結果はPRへ書く。自動テストが適用外なら理由と代わりの確認を書く。"
    validations:
      required: true
