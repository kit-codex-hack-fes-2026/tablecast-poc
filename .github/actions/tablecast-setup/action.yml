name: TableCastの固定依存
description: Bunの取得キャッシュと固定依存を準備する
inputs:
  turbo:
    description: 決定的な静的解析・ビルドのTurborepoキャッシュを復元する
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "24.7.0"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.3.13"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.bun/install/cache
        key: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: |
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        bun --no-env-file run codegen
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.turbo == 'true'
      with:
        path: .turbo
        key: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-
