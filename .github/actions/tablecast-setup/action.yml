name: TableCastの固定依存
description: Bunの取得キャッシュと必要なPython環境を準備する
inputs:
  python:
    description: Python依存を導入する
    default: "false"
  turbo:
    description: 決定的な静的解析・ビルドのTurborepoキャッシュを復元する
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "24.7.0"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.3.13"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.bun/install/cache
        key: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: |
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        bun --no-env-file run codegen
    - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      if: inputs.python == 'true'
      with:
        version: "0.11.26"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: livekit/uv.lock
    - shell: bash
      if: inputs.python == 'true'
      run: uv sync --project livekit --locked
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.turbo == 'true'
      with:
        path: .turbo
        key: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'livekit/uv.lock') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'livekit/uv.lock') }}-${{ github.job }}-
