name: TableCastの固定依存
description: Bunの取得キャッシュと固定依存を準備する
inputs:
  turbo:
    description: 決定的な静的解析・ビルドのTurborepoキャッシュを復元する
    default: "false"
  codegen:
    description: Webの既定メッセージ構造でParaglideを生成する
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ">=24.22.0 <25"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.3"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: tablecast-bun-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.turbo == 'true'
      with:
        path: .turbo
        key: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: tablecast-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-
    - shell: bash
      run: bun --no-env-file install --frozen-lockfile --ignore-scripts
    # 同じ固定依存の取得cacheはstaticだけが保存し、他jobの圧縮・保存競合を避ける。
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.job == 'static' && steps.bun-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
    - shell: bash
      if: inputs.codegen == 'true'
      run: bun --no-env-file run codegen
