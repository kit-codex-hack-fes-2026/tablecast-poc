name: CI

on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      catalog_pr:
        description: 手動配備する通常PR番号（空欄なら全検査）
        type: string
        default: ""
      catalog:
        description: 手動配備するカタログ
        type: choice
        options: [all, storybook, email]
        default: all
      staging_reset:
        description: staging全体をリセットする場合はtablecast-stagingを入力
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  # 配備jobも含むため、PR更新で実行中のworkflowを中断しない。
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"
  TABLECAST_DEPLOY_ENV: ${{ github.event_name != 'pull_request' && (github.ref_name == 'staging' && 'staging' || 'production') || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'staging' && 'production' || 'preview') }}

jobs:
  test-plan:
    name: Test Selection（変更範囲と全件への復帰）
    if: ${{ !inputs.catalog_pr || github.ref_name == 'staging' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.plan.outputs.web }}
      components: ${{ steps.plan.outputs.components }}
      api: ${{ steps.plan.outputs.api }}
      runtime: ${{ steps.plan.outputs.runtime }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      presentation: ${{ steps.plan.outputs.presentation }}
      e2e: ${{ steps.plan.outputs.e2e }}
      build: ${{ steps.plan.outputs.build }}
      images: ${{ steps.plan.outputs.images }}
      base: ${{ steps.plan.outputs.base }}
      files: ${{ steps.plan.outputs.files }}
    steps:
      - name: 常設環境のCI履歴へ手動カタログを混在させない
        if: inputs.catalog_pr != ''
        run: |
          echo 'カタログは通常PRの作業branchを選択して起動してください。main/stagingからは起動できません。' >&2
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: plan
        with:
          script: |
            const {selectTablecastTests} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/tablecast-test-selection.ts`);
            let files = [];
            let base = '';
            const pr = context.payload.pull_request;
            const eligible = context.eventName === 'pull_request' && pr.head.ref !== 'staging';
            if (eligible) {
              try {
                const {data} = await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead: `${pr.base.sha}...${pr.head.sha}`});
                if (!/^[a-f0-9]{40}$/.test(data.merge_base_commit.sha) || !data.files?.length || data.files.length >= 300) throw new Error('差分を完全に取得できません');
                files = data.files.map(({filename, status, previous_filename}) => ({filename, status, previous_filename}));
                base = data.merge_base_commit.sha;
              } catch {
                core.notice('比較に失敗したため全件を実行します');
              }
            }
            const selection = selectTablecastTests(files, eligible ? 'pull_request' : 'full');
            for (const [key, value] of Object.entries(selection)) core.setOutput(key, String(value));
            core.setOutput('base', base);
            core.setOutput('files', JSON.stringify(files.map(file => file.filename)));
            await core.summary.addHeading('テストの選択').addRaw(selection.reason).addCodeBlock(JSON.stringify(selection, null, 2), 'json').write();

  static:
    name: "Static Analysis: コード整形・lint・型検査 (Oxfmt, Oxlint, TypeScript)"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - name: PRのコミットメッセージ
        if: github.event_name == 'pull_request'
        env:
          TABLECAST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TABLECAST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx --no-install commitlint --from "$TABLECAST_BASE_SHA" --to "$TABLECAST_HEAD_SHA" --verbose
      - name: mainのコミットメッセージ
        if: github.event_name != 'pull_request'
        run: bunx --no-install commitlint --last --verbose
      # lint/typecheckのTurbo依存が共有のi18n出力を復元するため、直列に実行する。
      - run: bun run format:check && bun run lint && bun run typecheck

  unit-web:
    name: "Unit/Integration: Web・seed・dev-runtime (Vitest)"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        if: needs.test-plan.outputs.web != 'none' || needs.test-plan.outputs.runtime != 'none' || needs.test-plan.outputs.fixtures != 'none' || needs.test-plan.outputs.presentation != 'none'
      # 個別CLIの既定枠を合算せず、重いruntimeは2、軽い3組は各1へ制限する。
      - parallel:
          - name: Seed fixtures
            if: needs.test-plan.outputs.fixtures != 'none'
            run: bunx --no-install vitest run --project scripts-unit --maxWorkers=1
          - name: Web
            if: needs.test-plan.outputs.web != 'none'
            working-directory: apps/web
            env:
              TABLECAST_TEST_MODE: ${{ needs.test-plan.outputs.web }}
              TABLECAST_TEST_FILES: ${{ needs.test-plan.outputs.files }}
            run: bun --no-env-file ../../scripts/tablecast-changed-vitest.ts --project unit --maxWorkers=1
          - name: Presentation
            if: needs.test-plan.outputs.presentation != 'none'
            run: bun run --cwd apps/presentation test -- --maxWorkers=1
          - name: Dev runtime
            if: needs.test-plan.outputs.runtime != 'none'
            env:
              TABLECAST_RUNTIME_SCOPE: ${{ needs.test-plan.outputs.runtime }}
            run: |
              if [ "$TABLECAST_RUNTIME_SCOPE" = imports ]; then
                bunx --no-install vitest run --project scripts-runtime scripts/tablecast-import-rules.test.ts
              else
                bunx --no-install vitest run --project scripts-runtime
              fi

  api:
    name: "Unit and Integration Test: APIの認可・注文・MCPツール (Vitest, D1, shard ${{ matrix.shard }}/2)"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        if: needs.test-plan.outputs.api != 'none'
      # 実行時間と失敗fileの順序だけを復元し、成功したテストを省略しない。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.test-plan.outputs.api != 'none'
        with:
          path: apps/api/node_modules/.vite/vitest/*/results.json
          key: tablecast-vitest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: tablecast-vitest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ matrix.shard }}-
      - if: needs.test-plan.outputs.api != 'none'
        run: bun run --cwd apps/api test -- --shard=${{ matrix.shard }}/2

  build:
    name: "Build: Workers"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.head.ref != 'staging' && github.event.pull_request.number || '' }}
    steps:
      - name: forkの配備対象外を記録
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'fork PRはsecretを使わずbuildのみ実施し、カタログ配備・コメント更新の対象外とする。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        if: needs.test-plan.outputs.build == 'true'
        with:
          turbo: "true"
      - name: Workers
        if: needs.test-plan.outputs.build == 'true'
        run: bun --no-env-file run build:deploy
      - if: needs.test-plan.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/.cloudflare/output/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  components:
    name: "Component Test: UI操作とアクセシビリティ (Vitest Browser, Storybook)"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        if: needs.test-plan.outputs.components != 'none'
      # 実行時間と失敗fileの順序だけを復元し、成功したテストを省略しない。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.test-plan.outputs.components != 'none'
        with:
          path: apps/web/node_modules/.vite/vitest/*/results.json
          key: tablecast-vitest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-single-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: tablecast-vitest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-single-
      - parallel:
          - if: needs.test-plan.outputs.components != 'none'
            uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium webkit
          - if: needs.test-plan.outputs.components != 'none'
            uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium webkit
      - if: needs.test-plan.outputs.components != 'none'
        working-directory: apps/web
        env:
          TABLECAST_TEST_MODE: ${{ needs.test-plan.outputs.components }}
          TABLECAST_TEST_FILES: ${{ needs.test-plan.outputs.files }}
        run: |
          bun run i18n:compile --output-structure locale-modules
          bun --no-env-file ../../scripts/tablecast-changed-vitest.ts --project browser --project storybook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-components-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results/browser/**/*.png
          retention-days: 1

  e2e:
    name: "E2E Test: 注文・ログイン・会計 (Playwright, ${{ matrix.browser }}, shard ${{ matrix.shard }}/2)"
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","webkit"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ needs.test-plan.outputs.e2e == 'changed' && '0' || '1' }}
      - uses: ./.github/actions/tablecast-setup
        if: needs.test-plan.outputs.e2e != 'none'
      - parallel:
          - if: needs.test-plan.outputs.e2e != 'none'
            uses: ./.github/actions/tablecast-browser
            with:
              browsers: ${{ matrix.browser }}
          - if: needs.test-plan.outputs.e2e != 'none'
            uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: ${{ matrix.browser }}
          - name: Mailpit image
            if: needs.test-plan.outputs.e2e != 'none'
            run: docker pull axllent/mailpit:v1.29.2
      - name: Isolated cases · 4 workers · no retries
        if: needs.test-plan.outputs.e2e != 'none'
        env:
          TABLECAST_E2E_MODE: ${{ needs.test-plan.outputs.e2e }}
          TABLECAST_DIFF_BASE: ${{ needs.test-plan.outputs.base }}
        run: |
          if [ "$TABLECAST_E2E_MODE" = changed ] && git diff --name-only "$TABLECAST_DIFF_BASE...HEAD" > /dev/null; then
            bun run test:e2e --only-changed="$TABLECAST_DIFF_BASE" --project=tablecast-${{ matrix.browser }} --shard=${{ matrix.shard }}/2
          else
            bun run test:e2e --project=tablecast-${{ matrix.browser }} --shard=${{ matrix.shard }}/2
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/web/test-results/
          include-hidden-files: true
          retention-days: 1

  images:
    name: 配備用Containerイメージ
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: PR用OAuthをlinux/amd64で検証
        if: needs.test-plan.outputs.images == 'true'
        run: |
          docker build --platform linux/amd64 --file apps/emulate/Dockerfile --tag "tablecast-emulate:$TABLECAST_RELEASE_SHA" .
          trap 'docker rm --force tablecast-oauth-check' EXIT
          docker run --detach --name tablecast-oauth-check --publish 127.0.0.1:8080:8080 --env TABLECAST_ENV=preview --env TABLECAST_PUBLIC_ORIGIN=https://tablecast-pr-1.kit-codex.workers.dev "tablecast-emulate:$TABLECAST_RELEASE_SHA"
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/.well-known/openid-configuration > /dev/null
          docker save "tablecast-emulate:$TABLECAST_RELEASE_SHA" | gzip > tablecast-images.tar.gz
      - if: needs.test-plan.outputs.images == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: tablecast-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy-preview:
    name: PRプレビュー配備
    needs: [test-plan, static, build, images]
    if: needs.test-plan.outputs.build == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.head.ref != 'staging' && github.event.pull_request.number || '' }}
      TABLECAST_RUNTIME_SECRETS: ${{ secrets.TABLECAST_RUNTIME_SECRETS }}
      TABLECAST_MODEL: gpt-5.6-luna
      TABLECAST_OTEL_AUTHORIZATION: ${{ secrets.TABLECAST_OTEL_AUTHORIZATION }}
      TABLECAST_CONTAINER_METRICS_TOKEN: ${{ secrets.TABLECAST_CONTAINER_METRICS_TOKEN }}
      TABLECAST_OTEL_CAPTURE_CONTENT: ${{ vars.TABLECAST_OTEL_CAPTURE_CONTENT || 'true' }}
      TABLECAST_DEPLOY_SECRET: ${{ secrets.TABLECAST_DEPLOY_SECRET }}
      TABLECAST_GOOGLE_CLIENT_ID: ${{ secrets.TABLECAST_GOOGLE_CLIENT_ID }}
      TABLECAST_GOOGLE_CLIENT_SECRET: ${{ secrets.TABLECAST_GOOGLE_CLIENT_SECRET }}
      TABLECAST_BETTER_AUTH_API_KEY: ${{ secrets.TABLECAST_BETTER_AUTH_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: checkout
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
        id: setup
        background: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/.cloudflare/output/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: .local/tablecast-deploy/
      - name: 依存の準備完了を待つ
        wait: setup
      - name: 検証済みContainerイメージを読み込む
        run: docker load --input .local/tablecast-deploy/tablecast-images.tar.gz
      - name: 配備先URL
        id: target
        run: bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(process.env.GITHUB_OUTPUT, "url=" + deploymentTarget(process.env.TABLECAST_PR_NUMBER || undefined, process.env.TABLECAST_DEPLOY_ENV).origin + "\n")'
      - name: 資源作成・移行・検証済み成果物の配備・SHA確認
        run: bun --no-env-file run deploy

      - name: 製品と手動カタログの通知
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/tablecast-preview-comment
        with:
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          product-result: ${{ job.status }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  deploy:
    name: 本番・staging配備
    needs: [test-plan, static, unit-web, api, build, components, e2e, images]
    if: ${{ !inputs.catalog_pr && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging' && inputs.staging_reset == 'tablecast-staging')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: tablecast-deploy-${{ github.ref_name }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_RELEASE_SHA: ${{ github.sha }}
      TABLECAST_PR_NUMBER: ""
      TABLECAST_RUNTIME_SECRETS: ${{ secrets.TABLECAST_RUNTIME_SECRETS }}
      TABLECAST_MODEL: gpt-5.6-luna
      TABLECAST_OTEL_AUTHORIZATION: ${{ secrets.TABLECAST_OTEL_AUTHORIZATION }}
      TABLECAST_CONTAINER_METRICS_TOKEN: ${{ secrets.TABLECAST_CONTAINER_METRICS_TOKEN }}
      TABLECAST_OTEL_CAPTURE_CONTENT: ${{ vars.TABLECAST_OTEL_CAPTURE_CONTENT || 'true' }}
      TABLECAST_DEPLOY_SECRET: ${{ secrets.TABLECAST_DEPLOY_SECRET }}
      TABLECAST_GOOGLE_CLIENT_ID: ${{ secrets.TABLECAST_GOOGLE_CLIENT_ID }}
      TABLECAST_GOOGLE_CLIENT_SECRET: ${{ secrets.TABLECAST_GOOGLE_CLIENT_SECRET }}
      TABLECAST_BETTER_AUTH_API_KEY: ${{ secrets.TABLECAST_BETTER_AUTH_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/.cloudflare/output/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: .local/tablecast-deploy/
      - name: 検証済みContainerイメージを読み込む
        run: docker load --input .local/tablecast-deploy/tablecast-images.tar.gz
      - name: 配備先URL
        id: target
        run: bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(process.env.GITHUB_OUTPUT, "url=" + deploymentTarget(process.env.TABLECAST_PR_NUMBER || undefined, process.env.TABLECAST_DEPLOY_ENV).origin + "\n")'
      - name: 資源作成・移行・検証済み成果物の配備・SHA確認
        env:
          TABLECAST_RESET_CONFIRM: ${{ inputs.staging_reset }}
        run: |
          if [ "$TABLECAST_RESET_CONFIRM" = "tablecast-staging" ]; then
            bun --no-env-file run deploy --reset
          else
            bun --no-env-file run deploy
          fi

  required:
    name: TableCast CI
    if: ${{ always() && !inputs.catalog_pr }}
    needs: [test-plan, static, unit-web, api, build, components, e2e, images]
    runs-on: ubuntu-latest
    steps:
      - name: 全検査の成功確認
        env:
          TABLECAST_RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.TABLECAST_RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  preview-report:
    name: 変更対象外の製品と手動カタログの通知
    needs: [test-plan, static, build, images]
    if: always() && needs.test-plan.result == 'success' && needs.test-plan.outputs.build != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 製品と手動カタログの通知
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/tablecast-preview-comment
        with:
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          product-result: 変更対象外のため再配備なし
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  catalog-manual:
    name: 明示要求したカタログだけを配備
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_pr != '' && github.ref_name != 'staging' && github.ref_name != 'main'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/catalog-preview.yml
    with:
      pr: ${{ inputs.catalog_pr }}
      catalog: ${{ inputs.catalog }}
    secrets: inherit
