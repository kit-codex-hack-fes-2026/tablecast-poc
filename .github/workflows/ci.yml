name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  static:
    name: "Static Analysis: コード整形・lint・型検査 (Oxfmt, Oxlint, TypeScript, Ruff, ty)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
          turbo: "true"
      # codegenを共有するlint/typecheckは順に実行する。
      - run: bun run format:check && bun run lint && bun run typecheck

  unit-web:
    name: "Unit Test: Webロジックとseedデータ (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - name: Seed fixtures
            run: bunx --no-install vitest run --project scripts-unit
          - name: Web
            run: bun run --cwd apps/web test

  agent:
    name: "Unit and Integration Test: 音声AgentとTTS接続 (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
      - run: bun run --cwd livekit test

  api:
    name: "Unit and Integration Test: APIの認可・注文・MCPツール (Vitest, D1)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - run: bun run --cwd apps/api test

  dev-runtime:
    name: "Integration Test: 開発環境の起動とDB初期化 (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - run: bunx --no-install vitest run --project scripts-runtime

  workers-build:
    name: "Build: WebとAPIのデプロイ用成果物 (Vite, Wrangler)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - run: bun run build

  storybook-build:
    name: "Build: Componentカタログ (Storybook)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - run: bunx --no-install turbo run build:storybook

  components:
    name: "Component Test: UI操作とアクセシビリティ (Vitest Browser, Storybook)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium webkit
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium webkit
      - run: bun run test:browser

  e2e:
    name: "E2E Test: 注文・ログイン・会計 (Playwright, ${{ matrix.browser }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: ${{ matrix.browser }}
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: ${{ matrix.browser }}
          - name: Mailpit image
            run: docker pull axllent/mailpit:v1.29.2
      - name: Isolated cases · 4 workers · no retries
        run: bun run test:e2e --project=tablecast-${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-e2e-${{ matrix.browser }}
          path: apps/web/test-results/
          include-hidden-files: true
          retention-days: 7

  webrtc:
    name: "Integration Test: 音声の送受信・停止 (Playwright, LiveKit WebRTC)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium
          - name: Local services
            run: bun --no-env-file run dev
      - run: bun --no-env-file scripts/tablecast-livekit-check.ts
      - name: Stop local services
        if: always()
        run: bun --no-env-file run dev:stop
