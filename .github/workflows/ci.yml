name: CI

on:
  workflow_dispatch:
    inputs:
      staging_reset:
        description: staging設定の復旧にはtablecast-stagingを入力
        type: string
        required: true

permissions:
  contents: read

jobs:
  tablecast-staging-configuration-recovery:
    if: github.ref_name == 'codex/464-staging-reseed' && inputs.staging_reset == 'tablecast-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tablecast-deploy-staging
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4977b0a16042978adeb11907ef3e77a5f919d2b0
      - uses: ./.github/actions/tablecast-setup
      - name: 正本のCloudflare設定からメンテナンスWorkerを復旧
        run: |
          bun --no-env-file - <<'JS'
          import {convertToWranglerConfig, resolveAndParseConfig} from '@cloudflare/config';
          import {resolve} from 'node:path';
          import {mkdir, writeFile} from 'node:fs/promises';
          import {webCloudflareConfig} from './apps/web/cloudflare.config.ts';
          import {deploymentOptions, deploymentTarget, tablecastAdoptedResources} from './scripts/tablecast-deploy-config.ts';
          import {cloudflare, currentRevision} from './scripts/tablecast-deploy-api.ts';
          import {assertWorkerOwner} from './scripts/tablecast-infra-diff.ts';
          const sha='4977b0a16042978adeb11907ef3e77a5f919d2b0';
          const target=deploymentTarget(undefined,'staging');
          await currentRevision(target,sha);
          assertWorkerOwner(await cloudflare(`workers/scripts/${target.web}/settings`),target,false);
          const directory=resolve('.local/tablecast-staging-configuration-recovery');
          await mkdir(directory,{recursive:true,mode:0o700});
          const entrypoint=resolve(directory,'maintenance.js');
          await writeFile(entrypoint,'export default {fetch(){return new Response("TableCast staging maintenance",{status:503,headers:{"Cache-Control":"no-store"}})}};');
          const config=webCloudflareConfig(deploymentOptions(target,'0'.repeat(40),tablecastAdoptedResources.staging.database).web);
          config.worker.entrypoint=entrypoint;
          const parsed=await resolveAndParseConfig(config,{mode:'staging',isPreview:false});
          if(!parsed.success)throw parsed.error;
          const path=resolve(directory,'wrangler.json');
          await writeFile(path,JSON.stringify(convertToWranglerConfig(parsed.data)),{mode:0o600});
          await writeFile(resolve(directory,'empty.env'),'');
          await currentRevision(target,sha);
          const process=Bun.spawn(['node','node_modules/wrangler/bin/wrangler.js','deploy','--config',path,'--env-file',resolve(directory,'empty.env')],{stdout:'inherit',stderr:'inherit',stdin:'ignore'});
          if(await process.exited!==0)throw new Error('stagingの設定復旧に失敗しました');
          assertWorkerOwner(await cloudflare(`workers/scripts/${target.web}/settings`),target,false);
          console.log('stagingのメンテナンスWorkerを正本のCloudflare設定から復旧しました');
          JS
