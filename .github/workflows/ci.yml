name: TableCast CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 静的解析
            python: "true"
            command: bun run format:check && bun run lint && bun run typecheck
          - name: 単体・実Binding・音声接続テスト
            python: "true"
            command: bun run test
          - name: Workers・Storybookビルド
            python: "false"
            command: bun run build && bun run --cwd apps/web build:storybook
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          python: ${{ matrix.python }}
      - name: 検証
        run: ${{ matrix.command }}

  components:
    name: UI部品・アクセシビリティ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - run: bun --no-env-file apps/web/node_modules/.bin/playwright install --with-deps chromium
      - run: bun --no-env-file run test:browser

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
      - run: bun --no-env-file apps/web/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: 隔離したWorkersで日英注文・認証・会計を検証
        run: bun --no-env-file run test:e2e --project=tablecast-${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-e2e-${{ matrix.browser }}
          path: |
            apps/web/test-results/
            .local/logs/dev.log
          include-hidden-files: true
          retention-days: 7

  webrtc:
    name: 合成音声の実WebRTC送受信・切断
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
      - run: bun --no-env-file apps/web/node_modules/.bin/playwright install --with-deps chromium
      - run: bun --no-env-file run dev
      - run: bun --no-env-file scripts/tablecast-livekit-check.ts
      - name: 自worktreeのプロセスを終了
        if: always()
        run: bun --no-env-file run dev:stop
