name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  static:
    name: "Static Analysis: コード整形・lint・型検査 (Oxfmt, Oxlint, TypeScript, Ruff, ty)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
          turbo: "true"
      # codegenを共有するlint/typecheckは順に実行する。
      - run: bun run format:check && bun run lint && bun run typecheck

  unit-web:
    name: "Unit Test: Webロジックとseedデータ (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - name: Seed fixtures
            run: bunx --no-install vitest run --project scripts-unit
          - name: Web
            run: bun run --cwd apps/web test

  agent:
    name: "Unit and Integration Test: 音声AgentとTTS接続 (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
      - run: bun run --cwd livekit test

  api:
    name: "Unit and Integration Test: APIの認可・注文・MCPツール (Vitest, D1)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - run: bun run --cwd apps/api test

  dev-runtime:
    name: "Integration Test: 開発環境の起動とDB初期化 (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - run: bunx --no-install vitest run --project scripts-runtime

  workers-build:
    name: "Build: WebとAPIのデプロイ用成果物 (Vite, Wrangler)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - run: bun run build

  storybook-build:
    name: "Build: Componentカタログ (Storybook)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - run: bunx --no-install turbo run build:storybook

  components:
    name: "Component Test: UI操作とアクセシビリティ (Vitest Browser, Storybook)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium webkit
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium webkit
      - run: bun run test:browser

  e2e:
    name: "E2E Test: 注文・ログイン・会計 (Playwright, ${{ matrix.browser }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: ${{ matrix.browser }}
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: ${{ matrix.browser }}
          - name: Mailpit image
            run: docker pull axllent/mailpit:v1.29.2
      - name: Isolated cases · 4 workers · no retries
        run: bun run test:e2e --project=tablecast-${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-e2e-${{ matrix.browser }}
          path: apps/web/test-results/
          include-hidden-files: true
          retention-days: 7

  webrtc:
    name: "Integration Test: 音声の送受信・停止 (Playwright, LiveKit WebRTC)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          python: "true"
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium
          - name: Local services
            run: bun --no-env-file run dev
      - run: bun --no-env-file scripts/tablecast-livekit-check.ts
      - name: Stop local services
        if: always()
        run: bun --no-env-file run dev:stop
  images:
    name: 配備用Containerイメージ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 音声AgentとPR用OAuthをlinux/amd64で検証
        run: |
          docker build --platform linux/amd64 --tag tablecast-voice:check livekit
          docker run --rm --network none --entrypoint python tablecast-voice:check -c 'from livekit.plugins import silero; silero.VAD.load()'
          docker build --platform linux/amd64 --file apps/emulate/Dockerfile --tag tablecast-emulate:check .
          docker run --detach --name tablecast-oauth-check --publish 127.0.0.1:8080:8080 --env TABLECAST_ENV=preview --env TABLECAST_PUBLIC_ORIGIN=https://tablecast-pr-1.kit-codex.workers.dev tablecast-emulate:check
          trap 'docker rm --force tablecast-oauth-check' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/.well-known/openid-configuration > /dev/null

  deploy:
    name: 本番・PR配備
    needs:
      [
        static,
        unit-web,
        agent,
        api,
        dev-runtime,
        workers-build,
        storybook-build,
        components,
        e2e,
        webrtc,
        images,
      ]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.number }}
      TABLECAST_RUNTIME_SECRETS: ${{ secrets.TABLECAST_RUNTIME_SECRETS }}
      TABLECAST_DEPLOY_SECRET: ${{ secrets.TABLECAST_DEPLOY_SECRET }}
      TABLECAST_GOOGLE_CLIENT_ID: ${{ secrets.TABLECAST_GOOGLE_CLIENT_ID }}
      TABLECAST_GOOGLE_CLIENT_SECRET: ${{ secrets.TABLECAST_GOOGLE_CLIENT_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
      - name: 配備先URL
        id: target
        run: bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(process.env.GITHUB_OUTPUT, "url=" + deploymentTarget(process.env.TABLECAST_PR_NUMBER || undefined).origin + "\n")'
      - name: 資源作成・移行・ビルド・配備・SHA確認
        run: bun --no-env-file scripts/tablecast-deploy.ts
      - name: PRへ配備結果を記録
        if: success() && github.event_name == 'pull_request'
        run: |
          bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(".local/tablecast-deploy/result.md", "配備確認済み: " + deploymentTarget(process.env.TABLECAST_PR_NUMBER).origin + "\n\n対象SHA: " + process.env.TABLECAST_RELEASE_SHA + "\n")'
          gh pr comment "$TABLECAST_PR_NUMBER" --body-file .local/tablecast-deploy/result.md
