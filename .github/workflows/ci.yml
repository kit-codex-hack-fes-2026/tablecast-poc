name: CI

on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      staging_reset:
        description: staging全体をリセットする場合はtablecast-stagingを入力
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"
  TABLECAST_DEPLOY_ENV: ${{ github.event_name != 'pull_request' && (github.ref_name == 'staging' && 'staging' || 'production') || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'staging' && 'production' || 'preview') }}

jobs:
  static:
    name: "Static Analysis: コード整形・lint・型検査 (Oxfmt, Oxlint, TypeScript)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - name: PRのコミットメッセージ
        if: github.event_name == 'pull_request'
        env:
          TABLECAST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TABLECAST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx --no-install commitlint --from "$TABLECAST_BASE_SHA" --to "$TABLECAST_HEAD_SHA" --verbose
      - name: mainのコミットメッセージ
        if: github.event_name != 'pull_request'
        run: bunx --no-install commitlint --last --verbose
      # setupでcodegen済み。format/lint/typecheckを並列実行する。
      - parallel:
          - run: bun run format:check
          - run: bun run lint
          - run: bun run typecheck

  unit-web:
    name: "Unit/Integration: Web・seed・dev-runtime (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - name: Seed fixtures
            run: bunx --no-install vitest run --project scripts-unit
          - name: Web
            run: bun run --cwd apps/web test
          - name: Presentation
            run: bun run --cwd apps/presentation test
          - name: Dev runtime
            run: bunx --no-install vitest run --project scripts-runtime

  api:
    name: "Unit and Integration Test: APIの認可・注文・MCPツール (Vitest, D1, shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - run: bun run --cwd apps/api test -- --shard=${{ matrix.shard }}/2

  build:
    name: "Build: Workers・Storybook・Email"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.head.ref != 'staging' && github.event.pull_request.number || '' }}
    steps:
      - name: forkの配備対象外を記録
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'fork PRはsecretを使わずbuildのみ実施し、カタログ配備・コメント更新の対象外とする。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
        with:
          turbo: "true"
      - parallel:
          - name: Workers
            run: bun --no-env-file run build:deploy
          - name: Storybook
            run: |
              bunx --no-install turbo run build:storybook
              bun --no-env-file run deploy:catalog --prepare-storybook
          - name: Email
            run: bun --no-env-file run build:email
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/dist/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-storybook-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/storybook-static/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-email-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/api/email-static/
          retention-days: 1
          if-no-files-found: error

  catalog-deploy:
    name: PRカタログの配備
    needs: [static, unit-web, build, components]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.head.ref != 'staging' && github.event.pull_request.number || '' }}
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-storybook-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/storybook-static/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-email-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/api/email-static/
      - name: Access保護・検証済みSHAの配備
        run: bun --no-env-file run deploy:catalog

  components:
    name: "Component Test: UI操作とアクセシビリティ (Vitest Browser, Storybook)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: chromium webkit
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: chromium webkit
      - run: bun run test:browser

  e2e:
    name: "E2E Test: 注文・ログイン・会計 (Playwright, ${{ matrix.browser }}, shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","webkit"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/tablecast-setup
      - parallel:
          - uses: ./.github/actions/tablecast-browser
            with:
              browsers: ${{ matrix.browser }}
          - uses: ./.github/actions/tablecast-browser-deps
            with:
              browsers: ${{ matrix.browser }}
          - name: Mailpit image
            run: docker pull axllent/mailpit:v1.29.2
      - name: Isolated cases · 4 workers · no retries
        run: bun run test:e2e --project=tablecast-${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: tablecast-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/web/test-results/
          include-hidden-files: true
          retention-days: 1

  images:
    name: 配備用Containerイメージ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: PR用OAuthをlinux/amd64で検証
        run: |
          docker build --platform linux/amd64 --file apps/emulate/Dockerfile --tag "tablecast-emulate:$TABLECAST_RELEASE_SHA" .
          trap 'docker rm --force tablecast-oauth-check' EXIT
          docker run --detach --name tablecast-oauth-check --publish 127.0.0.1:8080:8080 --env TABLECAST_ENV=preview --env TABLECAST_PUBLIC_ORIGIN=https://tablecast-pr-1.kit-codex.workers.dev "tablecast-emulate:$TABLECAST_RELEASE_SHA"
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/.well-known/openid-configuration > /dev/null
          docker save "tablecast-emulate:$TABLECAST_RELEASE_SHA" | gzip > tablecast-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: tablecast-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy-preview:
    name: PRプレビュー配備
    needs: [static, build, images]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.head.ref != 'staging' && github.event.pull_request.number || '' }}
      TABLECAST_RUNTIME_SECRETS: ${{ secrets.TABLECAST_RUNTIME_SECRETS }}
      TABLECAST_MODEL: gpt-5.6-luna
      TABLECAST_OTEL_AUTHORIZATION: ${{ secrets.TABLECAST_OTEL_AUTHORIZATION }}
      TABLECAST_CONTAINER_METRICS_TOKEN: ${{ secrets.TABLECAST_CONTAINER_METRICS_TOKEN }}
      TABLECAST_OTEL_CAPTURE_CONTENT: ${{ vars.TABLECAST_OTEL_CAPTURE_CONTENT || 'true' }}
      TABLECAST_DEPLOY_SECRET: ${{ secrets.TABLECAST_DEPLOY_SECRET }}
      TABLECAST_GOOGLE_CLIENT_ID: ${{ secrets.TABLECAST_GOOGLE_CLIENT_ID }}
      TABLECAST_GOOGLE_CLIENT_SECRET: ${{ secrets.TABLECAST_GOOGLE_CLIENT_SECRET }}
      TABLECAST_BETTER_AUTH_API_KEY: ${{ secrets.TABLECAST_BETTER_AUTH_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: .local/tablecast-deploy/
      - name: 検証済みContainerイメージを読み込む
        run: docker load --input .local/tablecast-deploy/tablecast-images.tar.gz
      - name: 配備先URL
        id: target
        run: bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(process.env.GITHUB_OUTPUT, "url=" + deploymentTarget(process.env.TABLECAST_PR_NUMBER || undefined, process.env.TABLECAST_DEPLOY_ENV).origin + "\n")'
      - name: 資源作成・移行・検証済み成果物の配備・SHA確認
        run: bun --no-env-file run deploy

  deploy:
    name: 本番・staging配備
    needs: [static, unit-web, api, build, components, e2e, images]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging' && inputs.staging_reset == 'tablecast-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: tablecast-deploy-${{ github.ref_name }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_RELEASE_SHA: ${{ github.sha }}
      TABLECAST_PR_NUMBER: ""
      TABLECAST_RUNTIME_SECRETS: ${{ secrets.TABLECAST_RUNTIME_SECRETS }}
      TABLECAST_MODEL: gpt-5.6-luna
      TABLECAST_OTEL_AUTHORIZATION: ${{ secrets.TABLECAST_OTEL_AUTHORIZATION }}
      TABLECAST_CONTAINER_METRICS_TOKEN: ${{ secrets.TABLECAST_CONTAINER_METRICS_TOKEN }}
      TABLECAST_OTEL_CAPTURE_CONTENT: ${{ vars.TABLECAST_OTEL_CAPTURE_CONTENT || 'true' }}
      TABLECAST_DEPLOY_SECRET: ${{ secrets.TABLECAST_DEPLOY_SECRET }}
      TABLECAST_GOOGLE_CLIENT_ID: ${{ secrets.TABLECAST_GOOGLE_CLIENT_ID }}
      TABLECAST_GOOGLE_CLIENT_SECRET: ${{ secrets.TABLECAST_GOOGLE_CLIENT_SECRET }}
      TABLECAST_BETTER_AUTH_API_KEY: ${{ secrets.TABLECAST_BETTER_AUTH_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      TABLECAST_PREVIEW_ACCESS_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_ACCESS_POLICY_ID }}
      TABLECAST_PREVIEW_SERVICE_POLICY_ID: ${{ vars.TABLECAST_PREVIEW_SERVICE_POLICY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TABLECAST_RELEASE_SHA }}
      - uses: ./.github/actions/tablecast-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-workers-${{ env.TABLECAST_RELEASE_SHA }}
          path: apps/web/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tablecast-images-${{ env.TABLECAST_RELEASE_SHA }}
          path: .local/tablecast-deploy/
      - name: 検証済みContainerイメージを読み込む
        run: docker load --input .local/tablecast-deploy/tablecast-images.tar.gz
      - name: 配備先URL
        id: target
        run: bun --no-env-file -e 'import {deploymentTarget} from "./scripts/tablecast-deploy-config"; await Bun.write(process.env.GITHUB_OUTPUT, "url=" + deploymentTarget(process.env.TABLECAST_PR_NUMBER || undefined, process.env.TABLECAST_DEPLOY_ENV).origin + "\n")'
      - name: 資源作成・移行・検証済み成果物の配備・SHA確認
        env:
          TABLECAST_RESET_CONFIRM: ${{ inputs.staging_reset }}
        run: |
          if [ "$TABLECAST_RESET_CONFIRM" = "tablecast-staging" ]; then
            bun --no-env-file run deploy --reset
          else
            bun --no-env-file run deploy
          fi

  required:
    name: TableCast CI
    if: always()
    needs: [static, unit-web, api, build, components, e2e, images]
    runs-on: ubuntu-latest
    steps:
      - name: 全検査の成功確認
        env:
          TABLECAST_RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.TABLECAST_RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  preview-report:
    name: PRプレビューの統合通知
    needs: [deploy-preview, catalog-deploy]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TABLECAST_PREVIEW_RESULTS: ${{ toJSON(needs) }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const current = async () => {
              const {data} = await github.rest.pulls.get({...context.repo, pull_number: pr});
              return data.state === 'open' && data.head.sha === sha && data.head.repo?.full_name === repository;
            };
            if (!await current()) return;
            const results = JSON.parse(process.env.TABLECAST_PREVIEW_RESULTS);
            const targets = [
              {name: '製品', worker: `tablecast-pr-${pr}`, path: '/api/health', result: results['deploy-preview'].result},
              ...['storybook', 'email'].map(kind => ({name: kind, kind, worker: `tablecast-${kind}-pr-${pr}`, path: '/_tablecast/release.json', result: results['catalog-deploy'].result})),
            ];
            const rows = await Promise.all(targets.map(async target => {
              const origin = `https://${target.worker}.kit-codex.workers.dev`;
              let served = '未確認（現在版不明）';
              try {
                const response = await fetch(`${origin}${target.path}`, {
                  headers: {'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID, 'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET},
                  redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(10000),
                });
                if (!response.ok) throw new Error('配備情報を取得できません');
                const release = await response.json();
                if (target.kind && (release.repository !== repository || release.pr !== String(pr) || release.kind !== target.kind)) throw new Error('対象が一致しません');
                const value = target.kind ? release.sha : release.releaseSha;
                if (!/^[a-f0-9]{40}$/.test(value ?? '')) throw new Error('SHAが不正です');
                served = value;
              } catch {
                // 取得できない現在版を、前回のコメントや今回の対象SHAで推測しない。
              }
              return `| ${target.name} | ${origin} | ${target.result} | ${served} |`;
            }));
            // 既存カタログコメントをそのまま統合コメントとして更新する。
            const marker = '<!-- tablecast-catalog-preview -->';
            const body = [marker, 'PRプレビュー（Cloudflare Accessへのログインが必要）', '',
              `対象SHA: ${sha}`, '',
              '| 対象 | URL | 配備jobの結果 | 通知時に確認できた配備SHA |',
              '| --- | --- | --- | --- |', ...rows, '',
              'Storybook・メールの結果は共通のカタログ配備jobの結果。詳細は実行結果を参照。', '',
              `[実行結果](https://github.com/${repository}/actions/runs/${context.runId})`,
            ].join('\n');
            const comments = (await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr}))
              .filter(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (comments.length > 1) throw new Error('統合通知が重複しています');
            if (!await current()) return;
            if (comments.length) {
              await github.rest.issues.updateComment({...context.repo, comment_id: comments[0].id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr, body});
            }
            await core.summary.addRaw(body).write();
