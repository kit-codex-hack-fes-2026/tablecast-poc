name: TableCast staging seed operation cleanup
on:
  workflow_dispatch:
    inputs:
      staging_reset:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tablecast-deploy-staging
  cancel-in-progress: true
jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
