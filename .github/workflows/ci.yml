name: TableCast CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tablecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静的解析・実Binding・ブラウザー
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1"
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.7.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.13"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.26"
          python-version: "3.13"
      - name: 固定依存を導入
        run: |
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          uv sync --project livekit --locked
          bun --no-env-file apps/web/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: 静的解析と実DB・音声接続試験
        run: bun --no-env-file run check
      - name: WorkersとStorybookをビルド
        run: |
          bun --no-env-file run build
          bun --no-env-file run --cwd apps/web build:storybook
      - name: UI部品の操作とアクセシビリティ
        run: bun --no-env-file run test:browser
      - name: ローカル営業環境を起動
        run: bun --no-env-file run dev
      - name: 合成音声の実WebRTC送受信と切断
        run: bun --no-env-file scripts/tablecast-livekit-check.ts
      - name: CI内のブラウザー用ホスト解決
        run: bun --no-env-file -e 'const runtime = await Bun.file(".local/runtime.json").json(); console.log("127.0.0.1 " + new URL(runtime.origin).hostname)' | sudo tee -a /etc/hosts
      - name: 日英注文・受付・会計をブラウザーから検証
        run: bun --no-env-file run test:e2e
      - name: 本番相当のService Bindingを検証
        run: |
          bun --no-env-file run dev:parity
          bun --no-env-file run test:e2e
      - name: 自worktreeのプロセスを終了
        if: always()
        run: bun --no-env-file run dev:stop
