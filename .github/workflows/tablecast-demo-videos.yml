name: TableCast Demo Videos

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tablecast-demo-videos-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  TABLECAST_VIDEO_RUN: tablecast-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  videos:
    name: "Video Test: PRの実アプリで注文・提供・会計を収録 (Playwright, D1, FFmpeg)"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false
      - uses: ./.github/actions/tablecast-setup
      - name: ChromeとFFmpegを導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bunx --no-install playwright install --with-deps chrome
      - name: PRのアプリとDBを起動して実操作を収録・検査
        id: capture
        run: |
          mkdir -p apps/presentation/output
          bun run --cwd apps/presentation tablecast:pr-demo 2>&1 | tee apps/presentation/output/tablecast-pr-capture.log
      - name: 検査済みの実操作動画と対象SHAを保存
        id: demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.TABLECAST_VIDEO_RUN }}-demo
          path: |
            apps/presentation/output/tablecast-pr-capture/**/customer/video.mp4
            apps/presentation/output/tablecast-pr-capture/**/staff/video.mp4
            apps/presentation/output/tablecast-pr-capture/**/report.json
            apps/presentation/output/tablecast-pr-capture/**/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 失敗時を含む診断結果を保存
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.TABLECAST_VIDEO_RUN }}-diagnostics
          path: |
            apps/presentation/output/tablecast-pr-capture.log
            apps/presentation/output/tablecast-pr-capture-results.json
            apps/presentation/output/tablecast-pr-capture/**/*.log
            apps/presentation/output/tablecast-pr-capture/**/test-failed-*.png
            apps/presentation/output/tablecast-pr-capture/**/error-context.md
            apps/web/test-results/tablecast-runtime/
          if-no-files-found: warn
          retention-days: 7
      - name: 取得先と今回の収録結果を表示
        if: always()
        env:
          TABLECAST_CAPTURE_STATUS: ${{ steps.capture.outcome }}
          TABLECAST_UPLOAD_STATUS: ${{ steps.demo.outcome }}
          TABLECAST_DEMO_URL: ${{ steps.demo.outputs.artifact-url }}
          TABLECAST_DIAGNOSTICS_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          {
            echo '## PRの実アプリを収録したデモ'
            echo "対象: $TABLECAST_VIDEO_RUN"
            echo "- 起動・操作・録画・再生検査: $TABLECAST_CAPTURE_STATUS / 保存: $TABLECAST_UPLOAD_STATUS"
            echo "- ${TABLECAST_DEMO_URL:+[客向け・店側のMP4と収録記録]($TABLECAST_DEMO_URL)}"
            echo "- ${TABLECAST_DIAGNOSTICS_URL:+[診断結果]($TABLECAST_DIAGNOSTICS_URL)}"
            echo '- 今回のheadからビルドした実Web・API・D1を使用。注文・提供・会計の固定GUIシナリオを新規収録します。'
            echo '- 音声接客は無効。動画は無音で、保存録画・旧構成の技術紹介・有料TTS・LLMは使用しません。'
            echo '- 固定シナリオ外の変更は自動では映りません。必要に応じて撮影シナリオも同じPRで更新してください。'
            echo '- 7日保存。同じSHAの再収録はRe-run all jobs、変更後の再収録はPRへpush。保存済みの旧実行は期限まで残ります。'
            echo '- LFS転送なし。実行時間・保存容量はこの実行のジョブ時間とArtifactsのsizeで確認できます。'
          } >> "$GITHUB_STEP_SUMMARY"
