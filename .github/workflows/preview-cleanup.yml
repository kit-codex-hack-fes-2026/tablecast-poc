name: TableCast PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tablecast-deploy-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dbbd52d7d690afceea41fe920ae19f91
      TABLECAST_DEPLOY_ENV: preview
      TABLECAST_PR_NUMBER: ${{ github.event.pull_request.number }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      # PRのコードをcheckoutしない。cleanupは既定ブランチの実装だけを使う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/tablecast-setup
        id: setup
      - name: 閉じたPRのカタログを削除
        run: bun --no-env-file run deploy:catalog --cleanup
      - name: 閉じたPRの所有資源だけを削除
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun --no-env-file run deploy --cleanup
