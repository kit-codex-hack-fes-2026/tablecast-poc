name: tablecast-mutation
services:
  tablecast-lgtm:
    image: grafana/otel-lgtm:0.32.1
    volumes:
      - tablecast-lgtm:/data
  tablecast:
    image: tablecast-tablecast:latest
    init: true
    working_dir: /workspaces/tablecast
    command:
      [sh, -c, "git config --global --add safe.directory /workspaces/tablecast && sleep infinity"]
    extra_hosts:
      - mutation.tablecast-poc.container.localhost:127.0.0.1
    environment:
      TABLECAST_CONTAINER: "1"
      TABLECAST_WORKTREE_NAME: mutation
      TABLECAST_REPO_NAME: tablecast-poc
      TABLECAST_CONTAINER_ORIGIN: http://mutation.tablecast-poc.container.localhost:3100
      TABLECAST_RTC_TCP_PORT: "7981"
      TABLECAST_RTC_UDP_PORT: "7982"
    ports:
      - 127.0.0.1:3100:3100
      - 127.0.0.1:8125:8025
      - 127.0.0.1:7981:7981
      - 127.0.0.1:7982:7982/udp
    volumes:
      - type: bind
        source: ${TABLECAST_MUTATION_CHECKOUT:?Set TABLECAST_MUTATION_CHECKOUT to the isolated checkout}
        target: /workspaces/tablecast
        bind:
          create_host_path: false
      - tablecast-node:/workspaces/tablecast/node_modules
      - tablecast-web-node:/workspaces/tablecast/apps/web/node_modules
      - tablecast-api-node:/workspaces/tablecast/apps/api/node_modules
      - tablecast-emulate-node:/workspaces/tablecast/apps/emulate/node_modules
      - tablecast-livekit-node:/workspaces/tablecast/livekit/node_modules
      - tablecast-python:/workspaces/tablecast/livekit/.venv
      - tablecast-state:/workspaces/tablecast/.local
      - tablecast-web-output:/workspaces/tablecast/apps/web/dist
      - tablecast-web-vite:/workspaces/tablecast/apps/web/.wrangler
volumes:
  tablecast-lgtm:
  tablecast-node:
  tablecast-web-node:
  tablecast-api-node:
  tablecast-emulate-node:
  tablecast-livekit-node:
  tablecast-python:
  tablecast-state:
  tablecast-web-output:
  tablecast-web-vite:
