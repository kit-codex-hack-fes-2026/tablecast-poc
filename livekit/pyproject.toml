[project]
name = "tablecast-livekit"
version = "0.1.0"
description = "TableCastのLiveKit音声接続"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "livekit-agents[inworld,openai,silero]==1.8.0",
  "livekit-plugins-inworld==1.8.0",
  "httpx>=0.28.1,<0.29",
  "python-dotenv>=1.2,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[tool.uv]
# forkのworkspace sourceをcoreへ広げず、公式releaseへの依存を維持する。
no-sources-package = ["livekit-agents"]

[tool.uv.sources]
livekit-plugins-inworld = { git = "https://github.com/ReoHakase/tablecast-livekit-agents", rev = "2f36303643f00c9c521d9dc27a785a6f273bbfb1", subdirectory = "livekit-plugins/livekit-plugins-inworld" }

[project.scripts]
tablecast-voice = "tablecast_livekit.agent:main"
tablecast-voice-check = "tablecast_livekit.live_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "ty>=0.0.21,<0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
